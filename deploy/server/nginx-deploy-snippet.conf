# runpod.hyxer.top — immutable release serving (add-on snippet)
#
# Paste into the site's server{} block AFTER the existing root/index directives.
# Rules for this file:
#   * only `expires` is used (never add_header), so server-level security headers
#     such as Strict-Transport-Security keep inheriting unchanged;
#   * the entry document is never cached;
#   * the mutable pointer (/_rel/current, /_rel/previous) is NOT reachable from
#     the outside — it may only be used by the internal try_files checks below;
#   * no tags/ response is hard-cached while the URL is unversioned (see notes);
#   * all other routes keep their current behaviour.
#
# Install order: publish one valid release, then `nginx -t`, then reload.

# Entry document: served from the current release, never cached.
# try_files resolves the file directly (no internal location re-match), so the
# 404 guards below do not affect these hand-offs.
location = / {
    expires -1;
    try_files /_rel/current/index.html =404;
}

location = /index.html {
    expires -1;
    try_files /_rel/current/index.html =404;
}

# The pointer is an implementation detail: never serve it over HTTP.
location ~ "^/_rel/(?:current|previous)(?:/|$)" {
    return 404;
}

location = /_rel {
    return 404;
}

location = /_rel/ {
    return 404;
}

# Tag data.
#   index.html fetches ./tags/manifest.json (no-store) and then
#   ./tags/<csv>?v=<content-hash>. Because the CSV *URL path* itself is
#   unversioned, a hard cache would keep a stale copy forever whenever the
#   manifest fetch fails and the app falls back to the bare URL. So every
#   tags/ response revalidates (expires -1 => Cache-Control: no-cache).
#   Cost: one conditional request per tag load (nginx answers 304 from
#   Last-Modified/ETag, body not resent) — negligible next to the CSV parse.
location = /tags/manifest.json {
    expires -1;
    try_files /_rel/current/tags/manifest.json =404;
}

location /tags/ {
    expires -1;
    try_files /_rel/current$uri =404;
}

location ^~ /img/ {
    expires 30d;
    try_files /_rel/current$uri =404;
}

location = /favicon.ico {
    expires 30d;
    try_files /_rel/current/favicon.ico =404;
}

# Immutable assets: /_rel/<sha40>/... — one directory per commit, never rewritten.
location ~ "^/_rel/[0-9a-f]{40}/" {
    expires max;
    try_files $uri =404;
}
