# runpod.hyxer.top — immutable release serving (add-on snippet)
#
# Paste into the site's server{} block AFTER the existing root/index directives.
# Rules for this file:
#   * only `expires` is used (never add_header), so server-level security headers
#     such as Strict-Transport-Security keep inheriting unchanged;
#   * the entry document is never cached;
#   * the mutable pointer (/_rel/current, /_rel/previous) is NOT reachable from
#     the outside — it may only be used by the internal try_files checks below;
#   * no tags/ response is hard-cached while the URL is unversioned (see notes);
#   * all other routes keep their current behaviour.
#
# Install order: publish one valid release, then `nginx -t`, then reload.

# Entry document: served from the current release, never cached.
# try_files resolves the file directly (no internal location re-match), so the
# 404 guards below do not affect these hand-offs.
location = / {
    expires -1;
    try_files /_rel/current/index.html =404;
}

location = /index.html {
    expires -1;
    try_files /_rel/current/index.html =404;
}

# The pointer is an implementation detail: never serve it over HTTP.
location ~ "^/_rel/(?:current|previous)(?:/|$)" {
    return 404;
}

location = /_rel {
    return 404;
}

location = /_rel/ {
    return 404;
}

# Tag data.
#   index.html fetches ./tags/manifest.json (no-store) and then
#   ./tags/<csv>?v=<content-hash>. Because the CSV *URL path* itself is
#   unversioned, a hard cache would keep a stale copy forever whenever the
#   manifest fetch fails and the app falls back to the bare URL. So every
#   tags/ response revalidates (expires -1 => Cache-Control: no-cache).
#   Cost: one conditional request per tag load (nginx answers 304 from
#   Last-Modified/ETag, body not resent) — negligible next to the CSV parse.
location = /tags/manifest.json {
    expires -1;
    try_files /_rel/current/tags/manifest.json =404;
}

location /tags/ {
    expires -1;
    try_files /_rel/current$uri =404;
}

location ^~ /img/ {
    expires 30d;
    try_files /_rel/current$uri =404;
}

location = /favicon.ico {
    expires 30d;
    try_files /_rel/current/favicon.ico =404;
}

# Admin console entry: a static shell only. /admin -> /admin/ is a permanent
# redirect so the page's root-absolute /_rel/<sha>/ assets resolve; the shell is
# never cached and always follows the current release (no fixed SHA here).
# Showing the login page to anonymous visitors is intended: authorisation is
# enforced by /api/admin/*, never by hiding this file.
location = /admin {
    return 301 /admin/;
}

location = /admin/ {
    expires -1;
    try_files /_rel/current/admin.html =404;
}

# Catalog API: loopback-only upstream. proxy_pass has no URI part, so the
# request path (/api/...) is forwarded verbatim (no prefix stripping).
#   * only the direct peer is forwarded as X-Forwarded-For; a client-supplied
#     value is dropped, so uvicorn --forwarded-allow-ips=127.0.0.1 trusts
#     exactly one hop;
#   * caching is the backend's decision and is forwarded unchanged:
#     /api/catalog is no-cache + ETag, every /api/admin response (including
#     errors) is no-store. `expires off` stops nginx from adding or overriding
#     Cache-Control, `proxy_cache off` guarantees nginx never stores the
#     response itself.
location ^~ /api/ {
    expires off;
    proxy_cache off;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    # UI accepts input images up to 5 MiB; JSON+base64 envelope must fit too.
    client_max_body_size 6m;
}

# Immutable assets: /_rel/<sha40>/... — one directory per commit, never rewritten.
location ~ "^/_rel/([0-9a-f]{40})/(.+)$" {
    expires max;
    # releases live under _rel/releases/<sha40>/, not _rel/<sha40>/
    alias /www/wwwroot/runpod.hyxer.top/_rel/releases/$1/$2;
}
